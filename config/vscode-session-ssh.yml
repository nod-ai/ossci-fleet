apiVersion: v1
kind: Pod
metadata:
  name: {{POD_NAME}}
spec:
  volumes:
    - name: home-vol
      persistentVolumeClaim:
        claimName: {{PVC_CLAIM_NAME}}
    - name: home-local-vol
      emptyDir: {}
    - name: ssh-key
      secret:
        secretName: ssh-key-{{POD_NAME}}
    # Note: these are persistent and need to be created before first run with
    # a command like:
    # kubectl -n iree-dev create secret generic gpg-key-kdrewnia --from-file=kdrewnia-amd-secret.asc=kdrewnia-amd-secret.asc --from-file=kdrewnia-amd-public.asc=kdrewnia-amd-public.asc
    - name: gpg-key
      secret:
        secretName: gpg-key-kdrewnia
    # Also must be created before first run
    - name: amd-llm-api-token
      secret:
        secretName: amd-llm-api-token-kdrewnia
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: {{DEV_GID}}
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: vscode-ssh
      image: {{IMAGE}}
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: home-vol
          mountPath: {{HOME_DIR}}
          readOnly: false
        - name: home-local-vol
          mountPath: {{HOME_DIR}}/fast
          readOnly: false
        - name: ssh-key
          mountPath: /mnt/sshkey
          readOnly: true
        - name: gpg-key
          mountPath: /mnt/gpgkey
          readOnly: true
        - name: amd-llm-api-token
          mountPath: /mnt/amd-llm-api-token
          readOnly: true
      resources:
        limits:
          amd.com/gpu: {{GPU_LIMIT}}
